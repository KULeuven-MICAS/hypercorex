# Minimal CI (D25): the sw tests, including the golden fixtures, and lint.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs from pixi.lock with --locked and caches the env.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.46.0
      - name: Test
        run: pixi run test
      - name: Lint
        run: pixi run lint
